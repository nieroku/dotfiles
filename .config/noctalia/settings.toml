[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = ["top", "left", "right", "bottom"]

[bar.top]
capsule = true
capsule_border = "primary"
center = ["group:timedate"]
concave_edge_corners = false
end = ["group:volume", "brightness", "battery"]
margin_ends = 0
radius = 0
reserve_space = false
show_on_workspace_switch = false
start = ["group:connections", "caffeine", "notifications", "power_profile"]

[bar.top.dead_zone.actions]
right = "none"

[[bar.top.capsule_group]]
accordion = false
accordion_direction = "end"
border = "primary"
enabled = true
fill = "surface_variant"
id = "connections"
members = ["network", "bluetooth"]
opacity = 1.0
padding = 6.0

[[bar.top.capsule_group]]
accordion = false
accordion_direction = "end"
border = ""
enabled = true
fill = "on_primary"
id = "timedate"
members = ["clock", "date"]
opacity = 1.0
padding = 6.0

[[bar.top.capsule_group]]
accordion = false
accordion_direction = "end"
border = "primary"
enabled = true
fill = "surface_variant"
id = "volume"
members = ["volume", "input_volume"]
opacity = 1.0
padding = 6.0

[bar.left]
background_opacity = 0.0
center = ["workspaces"]
enabled = true
end = []
position = "left"
reserve_space = false
scale = 1.8
shadow = false
show_on_workspace_switch = false
start = []
thickness = 64

[bar.left.dead_zone.actions]
right = "none"

[bar.right]
background_opacity = 0.0
center = ["workspaces"]
enabled = true
end = []
position = "right"
reserve_space = false
scale = 1.8
shadow = false
show_on_workspace_switch = false
start = []
thickness = 64

[bar.right.dead_zone.actions]
right = "none"

[bar.bottom]
background_opacity = 0.0
capsule = true
capsule_border = "primary"
capsule_padding = 8.0
center = ["media"]
enabled = true
end = ["tray"]
margin_edge = 8
position = "bottom"
reserve_space = false
shadow = false
show_on_workspace_switch = false
start = ["audio_visualizer"]
thickness = 48

[bar.bottom.dead_zone.actions]
right = "none"

[brightness]
enable_ddcutil = true
minimum_brightness = 0.01

[desktop_widgets]
enabled = false

[hooks]
started = "~/.config/scripts/actually-smart-bars.sh"

[hot_corners]
enabled = false

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
pre_action_fade_seconds = 5

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 330.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1200.0

[keybinds]
down = ["Down", "Alt+j"]
left = ["Left", "Alt+h"]
right = ["Right", "Alt+l"]
tab_previous = ["Shift+ISO_Left_Tab", "Alt+Tab"]
up = ["Up", "Alt+k"]

[lockscreen_widgets]
enabled = false

[nightlight]
enabled = true
force = true
temperature_night = 6300

[osd]
background_opacity = 1.0
offset_x = 32
orientation = "vertical"
position_vertical = "center_right"

[shell]
font_family = "Noto Sans"
polkit_agent = true

[shell.launcher]
categories = false
show_app_actions = true

[shell.panel]
control_center_placement = "floating"
control_center_position = "center"
floating_layer = "top"
session_placement = "floating"
session_position = "center"
wallpaper_placement = "floating"
wallpaper_position = "center"

[shell.screenshot]
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "Alt+l"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "Alt+o"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "systemctl sleep"
countdown_seconds = 0.0
enabled = true
glyph = "zzz"
label = "Sleep"
shortcut = "Alt+s"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "systemctl hibernate"
countdown_seconds = 0.0
enabled = true
glyph = "arrow-big-down-line-filled"
label = "Hibernate"
shortcut = "Alt+h"
variant = "default"

[[shell.session.actions]]
action = "reboot"
command = "systemctl reboot"
countdown_seconds = 5.0
enabled = true
shortcut = "Alt+r"
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "systemctl poweroff"
countdown_seconds = 5.0
enabled = true
glyph = "power"
label = "Power Off"
shortcut = "Alt+p"
variant = "destructive"

[theme]
builtin = "Kanagawa"
community_palette = "Catppuccin Frappe Green"
source = "builtin"

[weather]
enabled = false

[widget.audio_visualizer]
bands = 64
color_1 = "secondary"
color_2 = "secondary"
mirrored = false
reversed = true
show_when_idle = true
width = 128

[widget.date]
format = "%a %d %b (%x)"

[widget.media]
anchor = true
max_length = 800
title_scroll = "always"

[widget.workspaces]
active_pill_size = 2.0
capsule = true
capsule_border = "primary"
change_color_on_hover = false
empty_color = "tertiary"
show_labels = false
